[workspace]
members = [
    "crates/ae-ast",
    "crates/ae-syntax",
    "crates/ae-sema",
    "crates/ae-codegen",
    "crates/ae-lsp",
    "crates/ae",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Aether Contributors"]
license = "MIT"

[workspace.dependencies]
blake3     = "1"
hex        = "0.4"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
# miette: default-features=false → pure Rust, no windows-sys C-dep
miette     = { version = "7", default-features = false }
thiserror  = "1"
logos      = "0.14"
# clap: drop `color` (anstyle → windows-sys C-dep), keep everything else
clap       = { version = "4", features = ["derive", "std", "help", "usage", "error-context", "suggestions"], default-features = false }
# lsp-types: pure Rust LSP type definitions
lsp-types  = "0.95"

ae-ast     = { path = "crates/ae-ast" }
ae-syntax  = { path = "crates/ae-syntax" }
ae-sema    = { path = "crates/ae-sema" }
ae-codegen = { path = "crates/ae-codegen" }
ae-lsp     = { path = "crates/ae-lsp" }

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true
