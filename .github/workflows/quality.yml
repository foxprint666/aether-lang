name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: cargo test -p ae-codegen

  python:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python SDK
        run: python -m pip install -e sdk/python pytest

      - name: Run focused Python tests
        run: python -m pytest sdk/python/tests/test_ast_engine.py sdk/python/tests/test_rollback_fault.py -q

  node:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json

      - name: Show Node versions
        run: |
          node --version
          npm --version

      - name: Install Node SDK dependencies
        working-directory: sdk/node
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) {
            $logRoot = Join-Path $env:npm_config_cache "_logs"
            if (Test-Path $logRoot) {
              Get-ChildItem $logRoot -Filter "*debug*.log" |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 3 |
                ForEach-Object {
                  Write-Host "----- npm debug log: $($_.FullName) -----"
                  Get-Content $_.FullName -Tail 200
                }
            }
            exit $LASTEXITCODE
          }

      - name: Build Node SDK
        working-directory: sdk/node
        run: npm run build

      - name: Run focused Node tests
        working-directory: sdk/node
        run: npm run test:focused
