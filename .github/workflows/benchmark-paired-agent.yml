name: Paired Blind Agent Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-blind-agent:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Cache pinned repository checkouts
        uses: actions/cache@v4
        with:
          path: .tmp/benchmark-repositories
          key: paired-agent-repos-${{ runner.os }}-${{ hashFiles('benchmarks/repositories/*_pinned.json') }}

      - name: Install Python benchmark dependencies
        run: python -m pip install -e sdk/python tiktoken

      - name: Run paired blind benchmark
        run: >-
          python benchmarks/run_paired_agent.py
          --allow-network-repos
          --experiment-id paired-agent-${{ github.run_id }}

      - name: Build paired-agent evidence report
        run: >-
          python benchmarks/analysis/paired_agent_evidence.py
          benchmarks/results/raw/paired-agent-${{ github.run_id }}.json
          --json-output benchmarks/results/processed/paired-agent-${{ github.run_id }}-evidence.json
          --markdown-output benchmarks/results/processed/PAIRED_BLIND_AGENT_REPORT.md

      - name: Upload paired-agent evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-blind-agent-${{ github.run_id }}
          path: |
            benchmarks/results/raw/paired-agent-${{ github.run_id }}.json
            benchmarks/results/processed/paired-agent-${{ github.run_id }}.csv
            benchmarks/results/processed/paired-agent-${{ github.run_id }}-evidence.json
            benchmarks/results/processed/PAIRED_BLIND_AGENT_REPORT.md
