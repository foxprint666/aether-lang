name: Benchmark Smoke

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  benchmark-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json

      - name: Show Node versions
        run: |
          node --version
          npm --version

      - name: Install Python SDK
        run: python -m pip install -e sdk/python pytest

      - name: Install Node SDK dependencies
        working-directory: sdk/node
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) {
            $logRoot = Join-Path $env:npm_config_cache "_logs"
            if (Test-Path $logRoot) {
              Get-ChildItem $logRoot -Filter "*debug*.log" |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 3 |
                ForEach-Object {
                  Write-Host "----- npm debug log: $($_.FullName) -----"
                  Get-Content $_.FullName -Tail 200
                }
            }
            exit $LASTEXITCODE
          }

      - name: Build Node SDK
        working-directory: sdk/node
        run: npm run build

      - name: Run benchmark smoke
        run: python benchmarks/run.py --suite smoke --mode both --trials 1 --experiment-id ci-smoke-${{ github.run_id }}

      - name: Upload benchmark outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-smoke-results
          path: |
            benchmarks/results/raw/ci-smoke-${{ github.run_id }}.json
            benchmarks/results/processed/ci-smoke-${{ github.run_id }}.csv
