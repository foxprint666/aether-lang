[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aether-lang-runtime"
version = "0.1.4"
description = "AI-Safe Execution Infrastructure: structured, sandboxed, reversible AI code modification"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["ai", "agents", "sandbox", "execution", "safe", "patch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
]
dependencies = [
    "jsonschema>=4.22",          # JSON Schema Draft 2020-12 validation
    "pathspec>=0.12",            # .gitignore-style pattern matching for snapshot archiver
    "zstandard>=0.23; sys_platform != 'win32'",  # fast snapshot compression (optional on Windows)
    "libcst>=1.1.0",             # AST parsing and transformation
]

[project.optional-dependencies]
wasm = [
    "wasmtime>=23.0",            # T2 WASM sandbox tier
]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
aether = "ai_runtime.cli:main"
ae-safe = "ai_runtime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ai_runtime"]

[tool.hatch.build.targets.wheel.force-include]
"ai_runtime/agent_skill/SKILL.md" = "ai_runtime/agent_skill/SKILL.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
